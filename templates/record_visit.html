{% extends "base.html" %}

{% block title %}Record Visit - Clinic System{% endblock %}

{% block content %}
<div class="content-header">
    <h1>Record Clinic Visit</h1>
    <p>Document patient consultation</p>
</div>

<div class="card form-card">
    <form method="POST">
        <div class="form-group">
            <label for="patient-search" class="form-label">Find a patient</label>
            <input type="search" id="patient-search" class="form-input patient-picker-search" placeholder="Search by name or patient code" value="{{ selected_patient.name if selected_patient else '' }}" autocomplete="off" data-patient-search="patient_id" aria-controls="patient_id">
            <p class="patient-search-feedback" aria-live="polite"></p>
            <label for="patient_id" class="form-label patient-select-label">Patient *</label>
            <select id="patient_id" name="patient_id" class="form-select" required>
                <option value="">Select a patient</option>
                {% for patient in patients %}
                <option value="{{ patient.patient_id }}" {% if selected_patient_id and selected_patient_id|int == patient.patient_id %}selected{% endif %}>
                    {{ patient.patient_code }} - {{ patient.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="appointment_id" class="form-label">Related Appointment (Optional)</label>
            <select id="appointment_id" name="appointment_id" class="form-select">
                <option value="">No appointment selected</option>
            </select>
            <p class="form-help">
                If linked to an appointment, the appointment status will be updated to Completed.
            </p>
        </div>

        <div class="form-group">
            <label for="visit_date" class="form-label">Visit Date *</label>
            <input type="date" id="visit_date" name="visit_date" class="form-input" value="{{ today }}" required>
        </div>

        <div class="form-group">
            <label for="diagnosis" class="form-label">Diagnosis</label>
            <input type="text" id="diagnosis" name="diagnosis" class="form-input" placeholder="e.g., Routine checkup, Common cold">
        </div>

        <div class="form-group">
            <label for="notes" class="form-label">Visit Notes *</label>
            <textarea id="notes" name="notes" class="form-textarea" required placeholder="Enter consultation notes..."></textarea>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-success">Record Visit</button>
            <a href="{{ url_for('visits') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const patientSelect = document.getElementById('patient_id');
    const appointmentSelect = document.getElementById('appointment_id');

    patientSelect.addEventListener('change', function() {
        const patientId = this.value;

        // Clear and disable appointment select
        appointmentSelect.innerHTML = '<option value="">No appointment selected</option>';
        appointmentSelect.disabled = true;

        if (patientId) {
            // Fetch appointments for selected patient
            fetch(`/api/patient/${patientId}/appointments`)
                .then(response => response.json())
                .then(data => {
                    if (data.appointments && data.appointments.length > 0) {
                        appointmentSelect.disabled = false;
                        data.appointments.forEach(appointment => {
                            const option = document.createElement('option');
                            option.value = appointment.appointment_id;
                            option.textContent = `${appointment.visit_date} at ${appointment.time}${appointment.reason ? ' - ' + appointment.reason : ''}`;
                            appointmentSelect.appendChild(option);
                        });
                    }
                })
                .catch(error => console.error('Error fetching appointments:', error));
        }
    });
});
</script>
{% endblock %}
